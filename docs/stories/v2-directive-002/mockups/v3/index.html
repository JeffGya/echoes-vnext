<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage stop marker v3: current, old mockup, new mockup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:"Spectral";src:url("assets/Spectral-Regular.ttf");font-weight:400}
@font-face{font-family:"Spectral";src:url("assets/Spectral-Bold.ttf");font-weight:700}
@font-face{font-family:"Spectral";src:url("assets/Spectral-SemiBoldItalic.ttf");font-weight:600;font-style:italic}
@font-face{font-family:"Iosevka Charon";src:url("assets/IosevkaCharon-Regular.ttf")}
@font-face{font-family:"Madimi One";src:url("assets/MadimiOne-Regular.ttf")}
:root{--ground:#120E0C;--parch:#F3E7D3;--ink:#3D2817;--gold:#D4AF37;--step:#C8A96E;--cream:#F5F1E7;--char:#2A2A3A;--badge:#0B1020}
*{box-sizing:border-box}
body{margin:0;background:#17151a;color:#d9d2c3;font:15px/1.4 "Spectral",serif}
.page{padding:18px 24px 48px;min-width:1330px}
h1{font:20px "Madimi One",sans-serif;margin:0 0 10px;color:#e8dcc4;font-weight:400}
.strip{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin:0 0 12px;font-size:13px}
.grp{display:flex;gap:4px;align-items:center}
.lbl{color:#8d8678;margin-right:4px}
.strip button,.strip select{font:13px "Spectral",serif;color:#d9d2c3;background:#24211f;border:1px solid #4a4339;border-radius:6px;padding:4px 10px;cursor:pointer}
.strip button.on{background:#d4af37;color:#3d2817;border-color:#d4af37}
.strip button:focus-visible,.strip select:focus-visible,.chg input:focus-visible{outline:2px solid #d4af37;outline-offset:2px}
#holder{position:relative}
#frame{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--ground);font-family:"Spectral",serif;color:var(--cream)}
.abs{position:absolute}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.t{position:absolute;width:128px;height:96px;background:url("assets/sanctum_tile_floor_clay_base_128x96.png") 0 0/256px 192px no-repeat;pointer-events:none}
.t.br{filter:url(#bridgeTint);opacity:.55}
.t.fg{filter:brightness(0);opacity:.65}
.s1{transform-origin:0 0}
.hud{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:15px}
.hud.cur,.hud.nw{background:rgba(243,231,211,.96);border:2px solid rgba(160,125,62,.72);border-radius:16px 5px 12px 8px;color:var(--ink);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.hud.old{background:rgba(26,39,30,.88);border:2px solid rgba(200,169,110,.7);border-radius:8px;color:#F5E6D3}
.hud b{font-weight:700;font-size:16px}
.hud .mono{font:15px "Iosevka Charon",monospace;margin-left:-60px}
.badge{height:36px;width:204px;display:flex;align-items:center;gap:8px;font-size:13px}
.badge.nw{background:var(--badge);border-radius:6px;color:#CFD3E0;overflow:hidden;padding-right:10px}
.badge.nw i.bar{width:4px;align-self:stretch;background:#7AB5C8}
.badge.nw i.dia{width:9px;height:9px;background:#6FA8DC;transform:rotate(45deg)}
.badge.old{background:rgba(26,39,30,.9);border:2px solid #7AB5C8;border-radius:6px;color:#F5E6D3;font-size:14px;padding-left:6px}
.badge.old i.bar{width:6px;height:24px;background:#7AB5C8}
.badge.old i.dia{width:9px;height:9px;background:#7AB5C8;transform:rotate(45deg)}
.jbox{width:196px;height:48px;border:2px solid #C8A96E;border-radius:8px;background:rgba(26,39,30,.92);display:flex;align-items:center;gap:12px;padding-left:14px;font-size:14px;color:#F5E6D3}
.snippet{text-align:center;font-size:15px;color:var(--cream);opacity:0;line-height:60px;height:60px;text-shadow:0 1px 3px rgba(0,0,0,.85);width:560px}
.stepsrow{display:flex;align-items:center;justify-content:center;gap:10px;height:32px;color:var(--step);font-size:14px;letter-spacing:.3px;width:100%}
.stepsrow .ds{display:flex;gap:10px}
.stepsrow .cnt{position:relative;width:34px;height:20px;font-size:14px}
.stepsrow .cnt span{position:absolute;left:0;top:0;opacity:0}
.dd{position:relative}
.dd>div{position:absolute;left:0;top:0}
.adv{border:1px solid rgba(116,90,39,.72);border-radius:10px;background:var(--gold);color:var(--ink);font:700 20px "Spectral",serif;box-shadow:0 2px 5px rgba(0,0,0,.4);cursor:pointer;height:56px}
.adv.old{background:rgba(200,169,110,.9);border:0;border-radius:8px;color:#2A2A3A;font:16px "Spectral",serif;box-shadow:none;height:48px;width:180px}
.adv:focus-visible,.home:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.home{background:var(--gold);color:var(--ink);font:700 20px "Spectral",serif;border:0;height:56px;width:140px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);cursor:pointer}
.pill{display:flex;align-items:center;background:#DED2C0;border:4px solid var(--gold);border-radius:34px;height:58px;padding:0 10px;gap:6px}
.echo{position:relative;display:flex;align-items:center;gap:8px;width:204px;height:46px;border-radius:10px}
.echo .sq{width:40px;height:46px;background:#2C2E36;color:#8f8a80;font:15px "Iosevka Charon",monospace;display:flex;align-items:center;justify-content:center;flex:none}
.echo .nm{font:16px "Iosevka Charon",monospace;color:var(--ink);line-height:1.15}
.echo .sts{font:italic 600 14px "Spectral",serif;color:#2E8B57;line-height:1.1}
.echo .sts.shk{color:#9A5A12}
.ring{position:absolute;inset:-4px;border-radius:12px;border:2px solid rgba(61,40,23,.7);opacity:0;pointer-events:none}
.band{background:#1A271E;border-top:2px solid rgba(200,169,110,.6);width:100%;height:88px}
.por{position:absolute;width:52px;height:52px;border-radius:50%;background:#3D5A47;border:2px solid #C8A96E}
.por .rr{position:absolute;border-radius:50%;opacity:0;pointer-events:none}
.pnm{position:absolute;font-size:11px;color:#F5E6D3;text-align:center;width:80px}
.why{position:absolute;width:360px;padding:12px 16px;opacity:0;display:none;z-index:20}
.why.nw{background:rgba(243,231,211,.96);border:2px solid rgba(160,125,62,.72);border-radius:16px 5px 12px 8px;color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.why.old{width:350px;background:rgba(26,39,30,.96);border:2px solid #C8A96E;border-radius:8px;color:#F5E6D3}
.why .r{display:flex;align-items:center;gap:10px;min-height:34px;font-size:15px}
.why.old .r{min-height:44px}
.why .r+.r{border-top:1px solid rgba(160,125,62,.28)}
.why.old .r+.r{border-top:1px solid rgba(200,169,110,.25)}
.why .g{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center}
.why .dot{width:6px;height:6px;background:#A07D3E;transform:rotate(45deg)}
.why .chip{width:26px;height:26px;background:#2C2E36;color:var(--cream);font:11px "Iosevka Charon",monospace;display:flex;align-items:center;justify-content:center}
.dpill{display:inline-flex;align-items:center;gap:6px;height:24px;padding-right:10px;background:var(--badge);border-radius:6px;overflow:hidden;font-size:13px;color:#CFD3E0}
.dpill i.bar{width:4px;align-self:stretch;background:#7AB5C8}
.dpill.old{border:2px solid #7AB5C8;background:#1A271E;color:#F5E6D3}
.hit{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;z-index:15}
.hit:focus-visible{outline:2px dashed var(--cream);outline-offset:2px}
.bubble{position:absolute;background:#2F7D4F;color:var(--cream);font-size:14px;padding:6px 12px;border-radius:10px;opacity:0;white-space:nowrap;border:1px solid rgba(0,0,0,.35)}
.token{position:absolute;width:50px;height:50px;border-radius:50%;background:#3373E6;border:3px solid rgba(18,14,12,.85);color:#fff;font:700 20px "Spectral",serif;display:flex;align-items:center;justify-content:center;margin:-25px 0 0 -25px}
.cap{font-size:13px;color:#8d8678;margin:10px 0 0;min-height:20px}
.chg{margin-top:14px;display:none;max-width:900px}
.chg.show{display:block}
.chg h2{font:16px "Madimi One",sans-serif;margin:0 0 6px;font-weight:400;color:#e8dcc4}
.chg label{display:flex;gap:8px;align-items:center;font-size:14px;padding:2px 0;cursor:pointer}
.chg .btns{margin-top:6px}
.chg button{font:13px "Spectral",serif;color:#d9d2c3;background:#24211f;border:1px solid #4a4339;border-radius:6px;padding:3px 10px;cursor:pointer;margin-right:6px}
#errs{display:none;position:fixed;left:0;bottom:0;background:#900;color:#fff;font:12px monospace;padding:6px;z-index:99}
#testout{display:none;position:fixed;right:0;top:0;background:#fff;color:#000;font:13px monospace;padding:8px;z-index:99;white-space:pre}
body.shot{background:#120E0C}
body.shot .page{padding:0;min-width:0}
body.shot .chrome{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="bridgeTint" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".87 0 0 0 0  0 .58 0 0 0  0 0 .24 0 0  0 0 0 1 0"/></filter></svg>
<div id="errs"></div><div id="testout"></div>
<div class="page">
  <div class="chrome">
    <h1>Stage stop marker: current game, old mockup, new mockup</h1>
    <div class="strip">
      <div class="grp"><span class="lbl">Mode</span><span id="gMode"></span></div>
      <div class="grp"><span class="lbl">Map</span><span id="gMap"></span></div>
      <div class="grp"><span class="lbl">Run</span><span id="gRun"></span></div>
      <div class="grp"><span class="lbl">Marker style</span><span id="gMS"></span></div>
      <div class="grp"><span class="lbl">Stop kind</span><select id="selKind" aria-label="Stop kind"></select></div>
      <div class="grp"><button id="bReplay">Replay</button><button id="bPause">Pause</button><button id="bSlow" aria-pressed="false">0.25x</button></div>
      <div class="grp"><span class="lbl">Size</span><span id="gSize"></span></div>
    </div>
  </div>
  <div class="chrome"><p class="cap" id="msNote" style="margin:0 0 10px"></p></div>
  <div id="holder"><div id="frame"></div></div>
  <div class="chrome">
    <p class="cap" id="cap"></p>
    <div class="chg" id="chg"><h2>What changed</h2><div id="chgList"></div><div class="btns"><button id="bAllOn">All on</button><button id="bAllOff">All off (old mockup)</button></div></div>
  </div>
</div>
<script src="assets/maps.js"></script>
<script>
(function(){
const errs=document.getElementById('errs');
window.addEventListener('error',e=>{errs.style.display='block';errs.textContent+=(e.message||'error')+' @'+(e.lineno||'')+' ';});
window.addEventListener('unhandledrejection',e=>{errs.style.display='block';errs.textContent+='promise: '+e.reason+' ';});

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const P=new URLSearchParams(location.hash.slice(1));
const SHOT=P.get('shot')==='1',TEST=P.get('test')==='1';
if(SHOT)document.body.classList.add('shot');

const WJ="[Jeff's wording]",SNIPPET='Some ground was walked so often it forgot it was ground.';
const Z=1.3;
const IMPROVE=[
 ['hud','1. Top bar: the parchment card of the live game, not a dark box.'],
 ['journey','2. No journey box on the board. The entry lives in the why card.'],
 ['marker','3. A quiet mark instead of the old marker: no pole, no ring. Four styles (Marker style).'],
 ['settle','4. The mark settles once (0.25 s). It does not pop in.'],
 ['cross','6. Lost steps are scratched out in the same beat as the mark.'],
 ['badge','7. Directive badge: plain dark pill, as in the live game.'],
 ['why','8. Why card: parchment, four rows, one column.'],
 ['snippet','9. Snippet and pulse wait for the mark (start at 0.9 s).'],
 ['shake','11. Shaken beat: a short small shake of the token and the step bar (PROPOSAL, 0.22 s).']
];
const MSNOTE={
 1:'Style 1, Rim badge: a small kind shape sits on the rim of the party token. You read: the party stopped, and the shape says how.',
 2:'Style 2, Floor stamp: a scuffed kind shape is pressed into the ground beside the party. You read: the party stopped here, and the shape says how.',
 3:'Style 3, Echo bar glyph: the board shows nothing extra. A small kind shape sits on the named Echo card, or on a blue party chip when no Echo is named. You read: who held the party, and how it stopped.',
 4:'Style 4, Last footprint: the final footprint of the trail takes the kind shape. You read: the path ended in this way.'
};
const MSPICK='My preference (one line): style 1, because it sits on the thing the player already looks at, needs no new place to learn, and works when no Echo is named.';
const KINDS={arrived:'Arrived',spent:'Spent',met:'Met something',spotted:'Spotted ahead',paused:'Paused to read',noway:'No way'};
const RUNS={
 calm:{label:'Calm, named Echo',kind:'paused',named:1,cause:'echo',cap:'Calm stop. One Echo is named.'},
 directive:{label:'Directive cause',kind:'arrived',named:-1,cause:'directive',cap:'The Directive alone decided. The cause shows as Directive.'},
 shaken:{label:'Shaken',kind:'spent',named:-1,cause:'party',shaken:true,cap:'Shaken party. Two steps are lost. The Echo cards read Shaken.'},
 edge:{label:'Edge stop',kind:'met',named:-1,cause:'terrain',edge:true,cap:''}
};
const ECHOES=[['Sena','SE'],['Ama','AM'],['Kweku','KW']];

const flags={};IMPROVE.forEach(i=>flags[i[0]]=true);
let st={mode:P.get('m')||'new',map:Number(P.get('map')||2),run:P.get('s')||'calm',kind:P.get('k')||'',size:P.get('z')==='1080'?1080:720,why:P.get('why')==='1',ms:[1,2,3,4].includes(Number(P.get('ms')))?Number(P.get('ms')):1};
if(P.get('off'))P.get('off').split(',').forEach(k=>{if(k in flags)flags[k]=false;});
if(!RUNS[st.run])st.run='calm';
let rate=1,paused=false,anims=[],cardAnim=null,tEnd=0,settleAt=850,timer=null;

/* ---------- marker shapes (kind specific) ---------- */
const DK='#1A271E',CH='#2A2A3A',CR='#F5E6D3';
function shape(k){
  return {
   arrived:{c:'#D4AF37',sh:p=>'<circle r="20" '+p+'/>',gl:'<circle r="11" stroke="'+CR+'" stroke-width="2.5" fill="none"/><circle r="5" fill="#C8A96E"/>'},
   spent:{c:'#A07D3E',sh:p=>'<rect x="-21" y="-18" width="42" height="36" rx="14" '+p+'/>',gl:'<rect x="-12" y="-10" width="24" height="5" rx="2" fill="'+CR+'"/><rect x="-12" y="-2" width="16" height="5" rx="2" fill="'+CR+'"/><rect x="-12" y="6" width="8" height="5" rx="2" fill="'+CR+'"/>'},
   met:{c:'#FFF8DC',sh:p=>'<polygon points="22,0 11,19.1 -11,19.1 -22,0 -11,-19.1 11,-19.1" '+p+'/>',gl:'<path d="M-15,-9 L-7,0 L-15,9 M15,-9 L7,0 L15,9" stroke="'+CR+'" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle r="3.5" fill="#C8A96E"/>'},
   spotted:{c:'#7AB5C8',sh:p=>'<polygon points="-20,-18 4,-18 24,0 4,18 -20,18" '+p+'/>',gl:'<path d="M-12,-9 L-3,0 L-12,9 M0,-9 L9,0 L0,9" stroke="'+CR+'" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'},
   paused:{c:'#7AB5C8',dash:'6 4',sh:p=>'<rect x="-25" y="-15" width="50" height="30" rx="15" '+p+'/>',gl:'<rect x="-9" y="-8" width="5.5" height="16" rx="2" fill="'+CR+'"/><rect x="3.5" y="-8" width="5.5" height="16" rx="2" fill="'+CR+'"/>'},
   noway:{c:'#C85A54',sh:p=>'<polygon points="20.3,8.4 8.4,20.3 -8.4,20.3 -20.3,8.4 -20.3,-8.4 -8.4,-20.3 8.4,-20.3 20.3,-8.4" '+p+'/>',gl:'<circle r="10" stroke="'+CR+'" stroke-width="2.5" fill="none"/><path d="M-7,-7 L7,7" stroke="'+CR+'" stroke-width="2.5" fill="none" stroke-linecap="round"/>'}
  }[k];
}
function head(k,calm){
  const s=shape(k),col=typeof calm==='string'?calm:(calm?'#D4AF37':s.c),dash=(calm===false&&s.dash)?' stroke-dasharray="'+s.dash+'"':'';
  return s.sh('fill="'+DK+'" stroke="'+CH+'" stroke-width="8" stroke-linejoin="round"'+dash)+
         s.sh('fill="'+DK+'" stroke="'+col+'" stroke-width="4" stroke-linejoin="round"'+dash)+s.gl;
}
function miniHead(k,calm,px){return '<svg width="'+px+'" height="'+px+'" viewBox="-30 -30 60 60" aria-hidden="true">'+head(k,calm)+'</svg>';}

/* marker group, drawn in screen px around the cell centre (0,0) */
function markerSVG(k,calm,side,ray){
  const s=shape(k);
  let g='<svg width="420" height="320" viewBox="-210 -230 420 320" style="position:absolute;left:-210px;top:-230px;overflow:visible" aria-hidden="true">';
  if(!calm){
    const rx=48,ry=24,hx=43,hy=-58,col=s.c,rd=s.dash?' stroke-dasharray="7 5"':'';
    g+='<ellipse rx="'+rx+'" ry="'+ry+'" fill="none" stroke="'+CH+'" stroke-width="6.5"/>'+
       '<ellipse rx="'+rx+'" ry="'+ry+'" fill="'+col+'" fill-opacity=".16" stroke="'+col+'" stroke-width="3"'+rd+'/>'+
       (k==='met'?'<ellipse rx="'+rx*.8+'" ry="'+ry*.8+'" fill="none" stroke="'+col+'" stroke-width="2"/>':'')+
       (k==='noway'?'<path d="M'+(-rx*.7)+','+ry*.7+' L'+rx*.7+','+(-ry*.7)+'" stroke="'+col+'" stroke-width="3"/>':'')+
       (k==='spotted'&&ray?'<line x1="0" y1="0" x2="'+ray[0]+'" y2="'+ray[1]+'" stroke="#7AB5C8" stroke-width="3" stroke-dasharray="8 7"/><ellipse cx="'+ray[0]+'" cy="'+ray[1]+'" rx="30" ry="15" fill="none" stroke="#7AB5C8" stroke-width="2.5"/>':'')+
       '<line x1="43" y1="10.7" x2="43" y2="-33.8" stroke="'+CR+'" stroke-width="3" stroke-linecap="round"/>'+
       '<g transform="translate('+hx+','+hy+') scale(1.1)">'+head(k,false)+'</g>';
  }
  return g+'</svg>';
}

/* quiet marks: no pole, no ring, no text. Kind is carried by the silhouette and the inner shape. */
function stampSVG(k,px){
  const s=shape(k);
  return '<g transform="scale(1,.6)">'+s.sh('fill="rgba(18,14,12,.4)" stroke="rgba(18,14,12,.8)" stroke-width="7" stroke-linejoin="round"')+
    s.sh('fill="none" stroke="#EADBB9" stroke-opacity=".9" stroke-width="3" stroke-linejoin="round"')+
    '<g opacity=".9">'+s.gl+'</g></g>';
}
function printSVG(k){
  const s=shape(k);
  return s.sh('fill="#3373E6" stroke="rgba(0,0,0,.7)" stroke-width="3" stroke-linejoin="round"')+s.gl;
}

/* ---------- step diamonds ---------- */
function diamond(w,h,fill,stroke,sw,extra){
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><polygon points="'+w/2+',1 '+(w-1)+','+h/2+' '+w/2+','+(h-1)+' 1,'+h/2+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" stroke-linejoin="round"/>'+(extra||'')+'</svg>';
}

/* ---------- helpers ---------- */
const frame=document.getElementById('frame'),holder=document.getElementById('holder');
function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}
function A(e,kf,o){
  o=Object.assign({fill:'both',easing:'ease-out'},o);
  if(RM){kf=kf.map(f=>{const g=Object.assign({},f);delete g.transform;return g;});if(o.rmStep)o.easing='steps(1,end)';o.duration=Math.min(o.duration||1,1);}
  const a=e.animate(kf,o);a.pause();a.currentTime=0;a.playbackRate=rate;anims.push(a);return a;
}
function setRate(){anims.forEach(a=>a.playbackRate=rate);if(cardAnim)cardAnim.playbackRate=rate;}
const cheb=(a,b)=>Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]));
const cellXY=(c,r)=>[64*(c+r)+64,32*(r-c)+32];

/* camera: exponential follow of the token (BoardCamera: lerp speed 5 per second) */
function camKeyframes(pts,walkMs,total){
  const frames=[];let cam=pts[0].slice();
  const n=pts.length-1,seg=walkMs/n;
  for(let t=0;t<=total;t+=1000/60){
    let tk;
    if(t>=walkMs)tk=pts[n];else{const i=Math.min(n-1,Math.floor(t/seg)),f=(t-i*seg)/seg;tk=[pts[i][0]+(pts[i+1][0]-pts[i][0])*f,pts[i][1]+(pts[i+1][1]-pts[i][1])*f];}
    cam=[cam[0]+(tk[0]-cam[0])*Math.min(1,5/60),cam[1]+(tk[1]-cam[1])*Math.min(1,5/60)];
    frames.push([t,cam.slice()]);
  }
  frames.push([total,pts[n].slice()]);
  return frames;
}

/* ---------- build ---------- */
function effective(){
  const mode=st.mode;
  if(mode==='cur')return {cur:true,hud:true,journey:true,marker:false,settle:false,steps:true,cross:false,badge:true,why:false,snippet:false,bottom:true};
  const o={cur:false,steps:false,bottom:false};IMPROVE.forEach(i=>o[i[0]]=(mode==='new')?flags[i[0]]:false);return o;
}

function build(){
  frame.innerHTML='';anims.forEach(a=>{try{a.cancel()}catch(e){}});anims=[];tEnd=0;cardAnim=null;
  const F=effective(),R=RUNS[st.run],kind=st.kind||R.kind,M=MAPS[st.map-1];
  const wide=st.size===1080,W=wide?1536:1280,H=wide?864:720,sc=wide?1.25:1;

  let wx=hs[0]>0?rightX:leftX;
  if(wx<16||wx+ww>W-16)wx=hs[0]>0?leftX:rightX;
  wx=Math.max(16,Math.min(W-16-ww,wx));
  const wy=Math.max(84,Math.min(safeB-wh,hyA-30));
  why.style.left=wx+'px';why.style.top=wy+'px';

  function openWhy(open){
    if(cardAnim)cardAnim.cancel();
    if(open){
      why.style.display='block';hits.forEach(h=>h.setAttribute('aria-expanded','true'));
      cardAnim=why.animate(RM?[{opacity:0},{opacity:1}]:[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:RM?1:150,easing:'ease-out',fill:'forwards'});
    }else{
      hits.forEach(h=>h.setAttribute('aria-expanded','false'));
      cardAnim=why.animate(RM?[{opacity:1},{opacity:0}]:[{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(4px)'}],{duration:RM?1:120,easing:'ease-in',fill:'forwards'});
      const a=cardAnim;a.onfinish=()=>{if(cardAnim===a)why.style.display='none';};
    }
    cardAnim.playbackRate=rate;if(paused)cardAnim.pause();
  }
  const isOpen=()=>hit.getAttribute('aria-expanded')==='true';
  hits.forEach(h=>{h.onpointerdown=()=>{if(!RM&&mk&&mk.firstChild&&MS!==3)mk.firstChild.animate([{transform:'scale(1)'},{transform:'scale(.95)'},{transform:'scale(1)'}],{duration:160,easing:'ease-out'});};
    h.onclick=e=>{e.stopPropagation();openWhy(!isOpen());};});
  frame.onpointerdown=e=>{if(isOpen()&&!why.contains(e.target)&&!hits.some(h=>h.contains(e.target)))openWhy(false);};
  document.onkeydown=e=>{if(e.key==='Escape'&&isOpen())openWhy(false);};

  /* master clock */
  const master=frame.animate([{opacity:1},{opacity:1}],{duration:3900,fill:'both'});
  master.pause();master.currentTime=0;master.playbackRate=rate;anims.push(master);tEnd=3900;
  let tDone=false;
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{
    if(!document.body.contains(frame)||master.playState==='idle')return;
    const t=master.currentTime||0;
    hits.forEach(h=>h.style.pointerEvents=(t>=settleAt||tDone)&&!F.cur?'auto':'none');
    adv.disabled=!(t>=1400||tDone);
  },50);
  frame._ctl={openWhy:openWhy,setDone:()=>{tDone=true;if(!F.cur)hits.forEach(h=>h.style.pointerEvents='auto');adv.disabled=false;},hit:hit,hits:hits,gap:gap,MS:MS,why:why,adv:adv,master:master};

  const caps=[];
  if(R.cap&&!F.cur)caps.push(R.cap);
  if(F.cur)caps.push('Current game: no stop marker, no cause, no crossed-out steps. The step count is the live one.');
  if(gap!==null)caps.push('Gap from the mark to the nearest other board mark: about '+gap+' px (limit 24).');
  if(R.edge&&!F.cur)caps.push('Edge stop: the camera has the party low and right. The tap area is '+(clamped?'cut back to':'already inside')+' the safe area (x '+Math.round(x0)+' to '+Math.round(x1)+', y '+Math.round(y0)+' to '+Math.round(y1)+', '+Math.round(x1-x0)+' x '+Math.round(y1-y0)+').');
  document.getElementById('cap').textContent=caps.join(' ');
}

function play(){
  anims.forEach(a=>{a.currentTime=0;a.playbackRate=rate;if(!paused)a.play();else a.pause();});
  document.querySelectorAll('.adv').forEach(b=>b.disabled=true);
  document.querySelectorAll('.hit').forEach(b=>b.style.pointerEvents='none');
  const w=document.querySelector('.why');if(w)w.style.display='none';
}
function freeze(t){anims.forEach(a=>{a.pause();a.currentTime=t;});if(frame._ctl)frame._ctl.setDone();}
function openWhyNow(){const w=document.querySelector('.why'),hs=document.querySelectorAll('.hit');w.style.display='block';w.style.opacity=1;hs.forEach(h=>h.setAttribute('aria-expanded','true'));}
function run(){
  build();
  const T=P.get('t');
  if(T!==null){freeze(T==='end'?tEnd:Number(T));if(st.why)openWhyNow();}
  else if(SHOT){freeze(tEnd);if(st.why)openWhyNow();}
  else play();
}

/* ---------- strip ---------- */
function seg(id,items,cur,cb){
  const g=document.getElementById(id);g.innerHTML='';
  items.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.setAttribute('data-k',k);if(String(k)===String(cur))b.className='on';b.onclick=()=>cb(k);g.appendChild(b);});
}
function sync(){
  seg('gMode',[['cur','Current game'],['old','Old mockup'],['new','New mockup']],st.mode,k=>{st.mode=k;sync();run();});
  seg('gMap',[[1,'1'],[2,'2'],[3,'3'],[4,'4']],st.map,k=>{st.map=Number(k);sync();run();});
  seg('gMS',[1,2,3,4].map(k=>[k,String(k)]),st.ms,k=>{st.ms=Number(k);sync();run();});
  const msOn=st.mode==='new'&&flags.marker;
  document.querySelectorAll('#gMS button').forEach(b=>b.disabled=!msOn);
  document.getElementById('msNote').textContent=msOn?MSNOTE[st.ms]+' '+MSPICK:'Marker style works in the New mockup when improvement 3 is on.';
  seg('gRun',Object.keys(RUNS).map(k=>[k,RUNS[k].label]),st.run,k=>{st.run=k;st.kind='';sync();run();});
  seg('gSize',[['720','1280x720'],['1080','1920x1080']],String(st.size),k=>{st.size=Number(k);sync();run();});
  const sel=document.getElementById('selKind');
  if(!sel.options.length)Object.keys(KINDS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=KINDS[k];sel.appendChild(o);});
  sel.value=st.kind||RUNS[st.run].kind;
  sel.disabled=st.mode==='cur';
  document.getElementById('chg').classList.toggle('show',st.mode==='new');
}
(function(){
  const l=document.getElementById('chgList');
  IMPROVE.forEach(i=>{
    const lab=document.createElement('label');lab.innerHTML='<input type="checkbox" data-f="'+i[0]+'" checked> <span>'+i[1]+'</span>';
    lab.querySelector('input').onchange=e=>{flags[i[0]]=e.target.checked;sync();run();};
    l.appendChild(lab);
  });
  const setAll=v=>{IMPROVE.forEach(i=>flags[i[0]]=v);l.querySelectorAll('input').forEach(c=>c.checked=v);sync();run();};
  document.getElementById('bAllOn').onclick=()=>setAll(true);
  document.getElementById('bAllOff').onclick=()=>setAll(false);
  IMPROVE.forEach(i=>{l.querySelector('[data-f="'+i[0]+'"]').checked=flags[i[0]];});
})();
document.getElementById('selKind').onchange=e=>{st.kind=e.target.value;run();};
document.getElementById('bReplay').onclick=()=>{paused=false;document.getElementById('bPause').textContent='Pause';run();};
document.getElementById('bPause').onclick=function(){
  paused=!paused;this.textContent=paused?'Play':'Pause';
  anims.forEach(a=>{if(paused)a.pause();else if(a.currentTime<a.effect.getComputedTiming().endTime)a.play();});
  if(cardAnim)paused?cardAnim.pause():cardAnim.play();
};
document.getElementById('bSlow').onclick=function(){
  rate=rate===1?.25:1;this.classList.toggle('on',rate!==1);this.setAttribute('aria-pressed',String(rate!==1));setRate();
};

sync();run();

/* ---------- in-page self test (#test=1): checks controls without waiting for time ---------- */
if(TEST){
  const out=document.getElementById('testout');out.style.display='block';
  const res=[];const ok=(n,c)=>res.push((c?'PASS ':'FAIL ')+n);
  try{
    const q=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
    const clickSeg=(g,k)=>q('#'+g+' [data-k="'+k+'"]').click();
    ok('autoplay runs',anims.some(a=>a.playState==='running'));
    q('#bPause').click();ok('pause holds every animation',anims.every(a=>a.playState!=='running'));
    q('#bPause').click();ok('play resumes',anims.some(a=>a.playState==='running'));
    q('#bSlow').click();ok('0.25x sets rate on all',anims.every(a=>a.playbackRate===.25));
    q('#bSlow').click();ok('1x restores rate',anims.every(a=>a.playbackRate===1));
    clickSeg('gMode','cur');ok('mode current: no marker',all('svg[viewBox="-210 -230 420 320"]').length===0&&q('.stepsrow .cnt'));
    clickSeg('gMode','old');ok('mode old: marker, journey box, no count',all('svg[viewBox="-210 -230 420 320"]').length===1&&!!q('.jbox')&&!q('.stepsrow .cnt'));
    clickSeg('gMode','new');ok('mode new: quiet mark, no old marker, no journey box',all('[data-mark]').length===1&&all('svg[viewBox="-210 -230 420 320"]').length===0&&!q('.jbox'));
    q('[data-f="journey"]').click();ok('toggle journey off shows box',!!q('.jbox'));
    q('[data-f="journey"]').click();ok('toggle journey on hides box',!q('.jbox'));
    clickSeg('gMap',4);ok('map 4 builds tiles',all('.t').length>50);
    clickSeg('gMap',2);
    freeze(1000);const c=frame._ctl;
    ok('hit enabled after settle',c.hit.style.pointerEvents==='auto');
    c.hit.click();ok('tap marker opens why',c.hit.getAttribute('aria-expanded')==='true'&&c.why.style.display==='block');
    frame.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));ok('tap outside closes why',c.hit.getAttribute('aria-expanded')==='false');
    clickSeg('gRun','edge');ok('edge run builds',!!q('.hit'));
    clickSeg('gSize','1080');ok('1920 size scales frame',frame.style.transform==='scale(1.25)');
    clickSeg('gSize','720');
    /* ---- round 4 checks ---- */
    clickSeg('gMode','new');
    const MARKS=['ms1','ms2','ms3','ms4'],gaps=[];
    for(let m=1;m<=4;m++){
      clickSeg('gMS',m);
      ok('marker style '+m+' builds one mark, no stick, no ring',all('[data-mark="'+MARKS[m-1]+'"]').length===1&&all('[data-mark] ellipse, [data-mark] line').length===0);
    }
    const sig={};
    for(let m=1;m<=4;m++){clickSeg('gMS',m);sig[m]=Object.keys(KINDS).map(k=>{st.kind=k;run();return q('[data-mark]').innerHTML;});}
    st.kind='';
    ok('each style draws six different shapes for six kinds',[1,2,3,4].every(m=>new Set(sig[m]).size===6));
    for(let m of [1,2,4]){clickSeg('gMS',m);for(let mp=1;mp<=4;mp++){clickSeg('gMap',mp);gaps.push(m+'/'+mp+':'+frame._ctl.gap);}}
    clickSeg('gMap',2);
    ok('gap to other marks is 24 px or more (styles 1,2,4 on 4 maps: '+gaps.join(' ')+')',gaps.every(g=>Number(g.split(':')[1])>=24));
    for(let m=1;m<=4;m++){clickSeg('gMS',m);freeze(1000);const hs=frame._ctl.hits;
      ok('style '+m+': '+hs.length+' tap area(s), each 48 x 48 or larger',hs.every(h=>h.offsetWidth>=48&&h.offsetHeight>=48));
      hs[hs.length-1].click();ok('style '+m+': tap on the mark area opens the why card',frame._ctl.why.style.display==='block');
      frame.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));
      hs[0].click();ok('style '+m+': tap on the token re-opens it',frame._ctl.why.style.display==='block'&&hs.every(h=>h.getAttribute('aria-expanded')==='true'));
      frame.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));}
    clickSeg('gMS',1);
    ok('no looping animation in New (all finite, 1 iteration)',anims.every(a=>a.effect.getComputedTiming().iterations===1));
    clickSeg('gRun','shaken');
    const shk=anims.filter(a=>a.effect.target&&(a.effect.target.classList.contains('shk')||a.effect.target.classList.contains('stepsrow'))&&a.effect.getKeyframes().some(k=>k.transform&&k.transform!=='none'&&k.transform.indexOf('translateX')===0));
    ok('shaken run: shake on token and step bar (2 animations)',shk.length===2);
    const tm=shk[0].effect.getComputedTiming();
    ok('shake: once, 0.2 to 0.25 s, starts with the cross-out',tm.iterations===1&&tm.duration>=200&&tm.duration<=250&&tm.delay===600);
    const tx=t=>{shk.forEach(a=>{a.pause();a.currentTime=t;});return new DOMMatrixReadOnly(getComputedStyle(shk[0].effect.target).transform).m41;};
    ok('shake moves mid-way (+/- 1 to 3 px) and is still after the end',Math.abs(tx(600+44))>=1&&Math.abs(tx(600+44))<=3&&tx(1000)===0&&tx(5000)===0);
    clickSeg('gRun','calm');
    ok('calm run: no shake',anims.filter(a=>a.effect.target&&a.effect.target.classList.contains('shk')&&a.effect.getKeyframes().length>2).length===0);
    ok('New keeps the old Advance, old steps and old Echo band',!!q('.adv.old')&&!q('.home')&&!q('.pill')&&!!q('.band')&&!!q('.stepsrow svg[width="20"]'));
    clickSeg('gMode','old');ok('Marker style is off in the Old mockup',all('#gMS button').every(b=>b.disabled));
    clickSeg('gMode','new');
    ok('no page errors',errs.style.display!=='block');
  }catch(e){res.push('FAIL exception '+e.message);}
  out.textContent=res.join('\n');
}
})();
