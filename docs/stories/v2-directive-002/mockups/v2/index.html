<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage stop marker, v2 options</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:"Spectral";src:url("assets/Spectral-Regular.ttf");font-weight:400}
@font-face{font-family:"Spectral";src:url("assets/Spectral-Bold.ttf");font-weight:700}
@font-face{font-family:"Spectral";src:url("assets/Spectral-SemiBoldItalic.ttf");font-weight:600;font-style:italic}
@font-face{font-family:"Iosevka Charon";src:url("assets/IosevkaCharon-Regular.ttf")}
@font-face{font-family:"Madimi One";src:url("assets/MadimiOne-Regular.ttf")}

:root{
  --ground:#120E0C; --parch:#F3E7D3; --parch-line:#A07D3E; --ink:#3D2817;
  --gold:#D4AF37; --gold-line:#745A27; --step:#C8A96E; --spent:#4D4D5C;
  --char:#2A2A3A; --token:#3373E6; --sit:#408CD9; --cream:#F5F1E7;
  --dark-panel:#1A271E; --badge:#0B1020;
}
*{box-sizing:border-box}
body{margin:0;background:#17151a;color:#d9d2c3;font:15px/1.4 "Spectral",serif}
.page{padding:20px 24px 48px;min-width:1330px}
h1{font:20px "Madimi One",sans-serif;margin:0 0 10px;color:#e8dcc4;font-weight:400}
.strip{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin:0 0 12px;font-size:13px}
.strip .grp{display:flex;gap:4px;align-items:center}
.strip .lbl{color:#8d8678;margin-right:4px}
.strip button,.strip select{font:13px "Spectral",serif;color:#d9d2c3;background:#24211f;border:1px solid #4a4339;border-radius:6px;padding:4px 10px;cursor:pointer}
.strip button.on{background:#d4af37;color:#3d2817;border-color:#d4af37}
.strip button:focus-visible,.strip select:focus-visible{outline:2px solid #d4af37;outline-offset:2px}
#holder{position:relative}
#frame{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--ground);font-family:"Spectral",serif;color:var(--cream)}
.abs{position:absolute}
.tile{position:absolute;background-image:url("assets/sanctum_tile_floor_clay_base_128x96.png");background-size:332.8px 249.6px;width:166.4px;height:124.8px;pointer-events:none}

/* HUD */
.hud{background:rgba(243,231,211,.96);border:2px solid rgba(160,125,62,.72);border-radius:16px 5px 12px 8px;color:var(--ink);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.hud b{font-weight:700;font-size:16px}
.hud .mono{font:15px "Iosevka Charon",monospace;margin-left:-60px}
.hud .st{font-size:15px}
.badge{height:36px;width:204px;background:var(--badge);border-radius:6px;display:flex;align-items:center;gap:8px;padding-right:10px;overflow:hidden;font-size:13px;color:#CFD3E0}
.badge i.bar{width:4px;align-self:stretch;background:#7AB5C8}
.badge i.dia{width:9px;height:9px;background:#6FA8DC;transform:rotate(45deg);display:block}
.snippet{text-align:center;font-size:15px;color:var(--cream);opacity:0;line-height:60px;height:60px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.qrow{height:30px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:14px;font-style:italic;max-width:380px}
.qrow.parch{background:rgba(243,231,211,.9);border:2px solid rgba(160,125,62,.72);border-radius:12px 5px 12px 8px;color:var(--ink)}
.qrow.dark{background:rgba(26,39,30,.9);border:1px solid rgba(131,109,49,.6);border-radius:8px;color:var(--cream)}

/* bottom */
.stepsrow{display:flex;align-items:center;justify-content:center;gap:12px;height:32px;color:var(--step);font-size:14px;letter-spacing:.3px}
.stepsrow .ds{display:flex;gap:10px}
.dia28{position:relative;width:28px;height:18px}
.dia28 svg{position:absolute;left:0;top:0}
.advance{background:var(--gold);border:1px solid rgba(116,90,39,.72);border-radius:10px;color:var(--ink);font:700 20px "Spectral",serif;box-shadow:0 2px 5px rgba(0,0,0,.4);cursor:pointer;height:56px}
.advance[disabled]{cursor:default}
.advance:focus-visible,.home:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.home{background:var(--gold);color:var(--ink);font:700 20px "Spectral",serif;border:0;height:56px;width:140px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);cursor:pointer}
.pill{display:flex;align-items:center;background:#DED2C0;border:4px solid var(--gold);border-radius:34px;height:58px;padding:0 10px;gap:6px}
.echo{position:relative;display:flex;align-items:center;gap:8px;width:204px;height:46px;border-radius:10px}
.echo .sq{width:40px;height:46px;background:#2C2E36;color:#8f8a80;font:15px "Iosevka Charon",monospace;display:flex;align-items:center;justify-content:center;flex:none}
.echo .nm{font:16px "Iosevka Charon",monospace;color:var(--ink);line-height:1.15}
.echo .sts{font:italic 600 14px "Spectral",serif;color:#2E8B57;line-height:1.1}
.echo .sts.shk{color:#9A5A12}
.echo .rest,.echo .pulse{position:absolute;inset:-4px;border-radius:12px;border:2px solid rgba(61,40,23,.7);opacity:0;pointer-events:none}
.echo .pulse{border-color:rgba(61,40,23,.8)}

/* why card */
.why{position:absolute;width:360px;padding:12px 16px;opacity:0;display:none;z-index:20}
.why.parch{background:rgba(243,231,211,.96);border:2px solid rgba(160,125,62,.72);border-radius:16px 5px 12px 8px;color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.why.dark{background:rgba(26,39,30,.94);border:2px solid rgba(131,109,49,.6);border-radius:12px;color:var(--cream);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.why .r{display:flex;align-items:center;gap:10px;min-height:34px;font-size:15px}
.why .r+.r{border-top:1px solid rgba(160,125,62,.28)}
.why .g{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center}
.why .dot{width:6px;height:6px;background:#A07D3E;transform:rotate(45deg)}
.why .chip{width:26px;height:26px;background:#2C2E36;color:var(--cream);font:11px "Iosevka Charon",monospace;display:flex;align-items:center;justify-content:center}
.why .dpill{display:inline-flex;align-items:center;gap:6px;height:24px;padding-right:10px;background:var(--badge);border-radius:6px;overflow:hidden;font-size:13px;color:#CFD3E0}
.why .dpill i.bar{width:4px;align-self:stretch;background:#7AB5C8}

.hit{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;z-index:15}
.hit:focus-visible{outline:2px dashed var(--cream);outline-offset:2px}
.bubble{position:absolute;background:#2F7D4F;color:var(--cream);font-size:14px;padding:6px 12px;border-radius:10px;opacity:0;white-space:nowrap;border:1px solid rgba(0,0,0,.35)}
.token{position:absolute;width:50px;height:50px;border-radius:50%;background:var(--token);border:3px solid rgba(18,14,12,.85);color:#fff;font:700 20px "Spectral",serif;display:flex;align-items:center;justify-content:center}
.tshadow{position:absolute;width:40px;height:16px;border-radius:50%;background:rgba(0,0,0,.38)}

/* page below */
.cap{font-size:13px;color:#8d8678;margin:10px 0 0;min-height:20px}
table.cmp{border-collapse:collapse;margin-top:26px;font-size:14px;min-width:860px}
table.cmp th,table.cmp td{border:1px solid #3a352d;padding:6px 12px;text-align:left;vertical-align:top}
table.cmp th{background:#201d1a;color:#e8dcc4;font-weight:700}
.pref{margin-top:12px;font-size:14px;color:#b9b19f}
#errs{display:none;position:fixed;left:0;bottom:0;background:#900;color:#fff;font:12px monospace;padding:6px;z-index:99}
body.shot{background:#120E0C}
body.shot .page{padding:0;min-width:0}
body.shot .chrome{display:none}
</style>
</head>
<body>
<div id="errs"></div>
<div class="page">
  <div class="chrome">
    <h1>Stage stop marker: three options</h1>
    <div class="strip" id="strip">
      <div class="grp"><span class="lbl">Option</span><span id="gOpt"></span></div>
      <div class="grp"><span class="lbl">Run</span><span id="gRun"></span></div>
      <div class="grp"><span class="lbl">Stop kind</span><select id="selKind" aria-label="Stop kind"></select></div>
      <div class="grp"><button id="bReplay">Replay</button><button id="bPause">Pause</button><button id="bSlow" aria-pressed="false">0.25x</button></div>
      <div class="grp"><span class="lbl">Size</span><span id="gSize"></span></div>
    </div>
  </div>
  <div id="holder"><div id="frame"></div></div>
  <div class="chrome">
    <p class="cap" id="cap"></p>
    <table class="cmp" id="cmp"></table>
    <p class="pref">Sr game artist leaning, one line: option A. The parchment card and the ring stay inside the look the screen has today.</p>
  </div>
</div>

<script>
(function(){
const errs=document.getElementById('errs');
window.addEventListener('error',e=>{errs.style.display='block';errs.textContent+=(e.message||'error')+' @'+(e.lineno||'')+' ';});
window.addEventListener('unhandledrejection',e=>{errs.style.display='block';errs.textContent+='promise: '+e.reason+' ';});

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const P=new URLSearchParams(location.hash.slice(1));
const SHOT=P.get('shot')==='1';
if(SHOT)document.body.classList.add('shot');

/* ---------- the five open choices, three coherent sets ---------- */
const OPTS={
 A:{name:'Ring and paper',   why:'parch', ring:true,  row:false, form:'per',    lost:'slash'},
 B:{name:'Dark and plain',   why:'dark',  ring:false, row:true,  form:'shared', lost:'hollow'},
 C:{name:'Quiet row',        why:'parch', ring:false, row:true,  form:'per',    lost:'hollow'}
};
const KINDS={arrived:'Arrived',spent:'Spent',met:'Met something',spotted:'Spotted ahead',paused:'Paused to read',noway:'No way'};
const RUNS={
 calm:     {label:'Calm, named Echo',   kind:'paused',  path:[[3,3],[4,3],[5,3],[5,4]], base:4, named:1, cause:'echo',  cap:'Calm stop. One Echo is named. The card pulses once.'},
 directive:{label:'Directive stop',     kind:'arrived', path:[[6,1],[6,2],[6,3],[6,4]], base:4, named:-1,cause:'directive', cap:'The Directive alone decided. The cause shows as Directive.'},
 shaken:   {label:'Shaken',             kind:'spent',   path:[[4,3],[4,4],[4,5]],       base:4, named:-1,cause:'party', shaken:true, cap:'Shaken party. Two of four steps are crossed out. The Echo cards read Shaken.'},
 edge:     {label:'Edge stop',          kind:'met',     path:[[5,5],[5,6],[5,7],[5,8],[5,9]], base:4, named:-1,cause:'terrain', cap:''}
};
const ECHOES=[['Sena','SE'],['Ama','AM'],['Kweku','KW']];
const SNIPPET='Some ground was walked so often it forgot it was ground.';
const WJ="[Jeff's wording]";

let st={opt:(P.get('o')||'A').toUpperCase(),run:P.get('s')||'calm',kind:P.get('k')||'',size:P.get('z')==='1080'?1080:720,why:P.get('why')==='1'};
if(!OPTS[st.opt])st.opt='A'; if(!RUNS[st.run])st.run='calm';
let rate=1,paused=false,anims=[],cardAnim=null,tEnd=0,settleAt=850;

/* ---------- marker heads ---------- */
function headShape(k,form){
  const fill='fill="#D4AF37" stroke="#2A2A3A" stroke-width="3" stroke-linejoin="round"';
  if(form==='shared')return '<circle cx="28" cy="28" r="22" '+fill+'/>'+kindMark(k);
  const m={
    arrived:'<circle cx="28" cy="28" r="22" '+fill+'/>',
    spent:'<rect x="8" y="8" width="40" height="40" rx="9" '+fill+'/>',
    met:'<polygon points="28,5 47,16 47,40 28,51 9,40 9,16" '+fill+'/>',
    spotted:'<polygon points="28,5 51,48 5,48" '+fill+'/>',
    paused:'<rect x="3" y="14" width="50" height="28" rx="14" '+fill+'/>',
    noway:'<polygon points="18,6 38,6 50,18 50,38 38,50 18,50 6,38 6,18" '+fill+'/>'
  };
  return m[k];
}
function kindMark(k){
  const s='fill="none" stroke="#2A2A3A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"';
  const m={
    arrived:'<path d="M18 29 L25 36 L38 21" '+s+'/>',
    spent:'<path d="M18 23 H38 M18 33 H38" '+s+'/>',
    met:'<path d="M28 15 V30" '+s+'/><circle cx="28" cy="38" r="2.6" fill="#2A2A3A"/>',
    spotted:'<path d="M17 34 L28 22 L39 34" '+s+'/>',
    paused:'<path d="M18 21 H38 M18 28 H34 M18 35 H38" '+s+'/>',
    noway:'<path d="M16 28 H40" '+s+'/>'
  };
  return m[k];
}
function headSVG(k,form,px){return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 56 56" aria-hidden="true">'+headShape(k,form)+'</svg>';}

/* ---------- step diamonds ---------- */
const DP='14,1 27,9 14,17 1,9';
function svgD(inner){return '<svg width="28" height="18" viewBox="0 0 28 18" aria-hidden="true">'+inner+'</svg>';}
const D_FILLED=svgD('<polygon points="'+DP+'" fill="#C8A96E" stroke="rgba(0,0,0,.55)" stroke-width="1.5" stroke-linejoin="round"/>');
const D_SPENT=svgD('<polygon points="'+DP+'" fill="rgba(77,77,92,.7)" stroke="rgba(0,0,0,.55)" stroke-width="1.5" stroke-linejoin="round"/>');
const D_SLASH=svgD('<polygon points="'+DP+'" fill="#4D4D5C" stroke="rgba(0,0,0,.55)" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 16 L23 2" stroke="#120E0C" stroke-width="4.5" stroke-linecap="round"/><path d="M5 16 L23 2" stroke="#F5F1E7" stroke-width="2" stroke-linecap="round"/>');
const D_HOLLOW=svgD('<polygon points="'+DP+'" fill="rgba(18,14,12,.6)" stroke="#120E0C" stroke-width="4.5" stroke-linejoin="round"/><polygon points="'+DP+'" fill="none" stroke="#C8A96E" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 9.5 L12.8 12.5 L19 5.5" fill="none" stroke="#120E0C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 9.5 L12.8 12.5 L19 5.5" fill="none" stroke="#C8A96E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>');

/* ---------- geometry ---------- */
function geo(W,H){
  const bcx=W/2,bcy=H/2-58;
  return {W:W,H:H,bcx:bcx,bcy:bcy,safeB:H-228,
    xy:(c,r)=>{const d=c-r,s=c+r;return [bcx+83.2*(d-1),bcy+41.6*(s-9)];}};
}
const manh=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);

/* ---------- animation helper ---------- */
function A(el,kf,o){
  o=Object.assign({fill:'both',easing:'ease-out'},o);
  if(RM){
    kf=kf.map(f=>{const g=Object.assign({},f);delete g.transform;return g;});
    if(o.rmStep)o.easing='steps(1,end)';
    o.duration=Math.min(o.duration||1,1);
  }
  const a=el.animate(kf,o);a.pause();a.currentTime=0;a.playbackRate=rate;anims.push(a);
  tEnd=Math.max(tEnd,(o.delay||0)+(o.duration||0));
  return a;
}
function setRate(){anims.forEach(a=>a.playbackRate=rate);if(cardAnim)cardAnim.playbackRate=rate;}

/* ---------- build one run ---------- */
const frame=document.getElementById('frame'),holder=document.getElementById('holder');
function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}

function build(){
  frame.innerHTML='';anims.forEach(a=>{try{a.cancel()}catch(e){}});anims=[];tEnd=0;cardAnim=null;
  const O=OPTS[st.opt],R=RUNS[st.run],kind=st.kind||R.kind;
  const wide=st.size===1080,W=wide?1536:1280,H=wide?864:720,sc=wide?1.25:1;
  const G=geo(W,H);
  frame.style.width=W+'px';frame.style.height=H+'px';frame.style.transform='scale('+sc+')';
  holder.style.width=(W*sc)+'px';holder.style.height=(H*sc)+'px';

  const path=R.path,n=path.length-1,seg=500/n;
  const stop=path[n],[sx,sy]=G.xy(stop[0],stop[1]);
  const prevX=G.xy(path[n-1][0],path[n-1][1])[0];
  const side=prevX>sx?-1:1;
  const lostN=R.shaken?2:0, spentN=n;

  /* tiles: reveal index = first step at which a cell is within 2 of the party */
  const revealIdx=(c,r)=>{for(let i=0;i<=n;i++){if(manh([c,r],path[i])<=2)return i;}return 99;};
  const dmin=-12,dmax=16,smin=-4,smax=34;
  const fogA=.30,fogB=.13,REV='brightness(.93) saturate(1.1)';
  let maxS=0;
  for(let s=smin;s<=smax;s++)for(let d=dmin;d<=dmax;d++){
    if(((d+s)%2+2)%2)continue;
    const c=(s+d)/2,r=(s-d)/2;if(revealIdx(c,r)<=n)maxS=Math.max(maxS,s);
  }
  for(let s=smin;s<=smax;s++)for(let d=dmin;d<=dmax;d++){
    if(((d+s)%2+2)%2)continue;
    const c=(s+d)/2,r=(s-d)/2,[x,y]=G.xy(c,r);
    if(x<-110||x>W+110||y<-70||y>H+110)continue;
    const ri=revealIdx(c,r);
    if(ri>n&&(s>maxS-1||manh([c,r],stop)>8))continue;
    const v=(((c*7+r*13)%4)+4)%4,t=el('div','tile',frame);
    t.style.left=(x-83.2)+'px';t.style.top=(y-44)+'px';
    t.style.backgroundPosition=(-(v%2)*166.4)+'px '+(-Math.floor(v/2)*124.8)+'px';
    const fog='brightness('+(s%2?fogB:fogA)+')';
    if(ri===0){t.style.filter=REV;}
    else{
      t.style.filter=fog;
      if(ri<=n)A(t,[{filter:fog},{filter:REV}],{delay:ri*seg,duration:350,easing:'ease-out'});
    }
  }

  /* footprints */
  path.slice(0,n).forEach((p,i)=>{
    const [x,y]=G.xy(p[0],p[1]);
    const f=el('div','abs',frame,'<svg width="44" height="24" viewBox="0 0 30 16"><ellipse cx="8" cy="10" rx="6" ry="3.4" fill="#3373E6" stroke="rgba(0,0,0,.65)" stroke-width="1.2"/><ellipse cx="22" cy="5" rx="6" ry="3.4" fill="#3373E6" stroke="rgba(0,0,0,.65)" stroke-width="1.2"/></svg>');
    f.style.left=(x-22)+'px';f.style.top=(y-12)+'px';f.style.opacity=0;
    A(f,[{opacity:0},{opacity:.85}],{delay:(i+1)*seg,duration:140});
  });

  /* situation markers: revealed as the fog lifts */
  const sitDefs=[
    {cx:stop[0]+1,cy:stop[1]-1,kind:'dia'},
    kind!=='met'||st.run!=='edge'?{cx:stop[0]-1,cy:stop[1]+1,kind:'ring'}:null
  ].filter(Boolean);
  sitDefs.forEach(m=>{
    const [x,y]=G.xy(m.cx,m.cy);
    // two cells away on the same screen line
    const dx=(m.kind==='dia'?166.4:-166.4);
    const px=sx+dx,py=sy;
    const e=el('div','abs',frame,m.kind==='dia'
      ?'<svg width="52" height="52" viewBox="0 0 52 52"><polygon points="26,3 49,26 26,49 3,26" fill="#408CD9" fill-opacity=".92" stroke="#12203a" stroke-width="3" stroke-linejoin="round"/></svg>'
      :'<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="21" fill="#408CD9" fill-opacity=".92" stroke="#12203a" stroke-width="2"/><circle cx="28" cy="28" r="25" fill="none" stroke="#D4AF37" stroke-width="3"/></svg>');
    e.style.left=(px-28)+'px';e.style.top=(py-28)+'px';e.style.opacity=0;
    A(e,[{opacity:0},{opacity:1}],{delay:n*seg+60,duration:300});
  });

  /* party token */
  const tsh=el('div','tshadow',frame);
  const tk=el('div','token',frame,'P');
  const pos=path.map(p=>G.xy(p[0],p[1]));
  tk.style.left=(pos[0][0]-25)+'px';tk.style.top=(pos[0][1]-37)+'px';
  tsh.style.left=(pos[0][0]-20)+'px';tsh.style.top=(pos[0][1]-8)+'px';
  const kfs=pos.map((p,i)=>({transform:'translate('+(p[0]-pos[0][0])+'px,'+(p[1]-pos[0][1])+'px)',offset:i/n}));
  A(tk,kfs,{duration:500,easing:'linear',rmStep:true});
  A(tsh,kfs,{duration:500,easing:'linear',rmStep:true});

  /* bubble (shipped, flavour) */
  const bub=el('div','bubble',frame,WJ);
  bub.style.left=(sx-side*70-62)+'px';bub.style.top=(sy-100)+'px';
  A(bub,[{opacity:0},{opacity:1,offset:.07},{opacity:1,offset:.87},{opacity:0}],{duration:3000,easing:'linear',delay:20});

  /* stop marker: ring + pole + head in one object */
  const hx=side*66,hy=-78;
  const mk=el('div','abs',frame);mk.style.left=sx+'px';mk.style.top=sy+'px';mk.style.opacity=0;
  mk.innerHTML='<svg width="300" height="200" viewBox="-150 -120 300 200" style="position:absolute;left:-150px;top:-120px;overflow:visible" aria-hidden="true">'+
    '<ellipse cx="0" cy="0" rx="60" ry="30" fill="none" stroke="#2A2A3A" stroke-width="6"/>'+
    '<ellipse cx="0" cy="0" rx="60" ry="30" fill="none" stroke="#D4AF37" stroke-width="3"/>'+
    '<path d="M'+(side*52)+' -6 L'+hx+' '+(hy+28)+'" stroke="#2A2A3A" stroke-width="7" stroke-linecap="round"/>'+
    '<path d="M'+(side*52)+' -6 L'+hx+' '+(hy+28)+'" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>'+
    '<g transform="translate('+(hx-28)+' '+(hy-28)+')">'+headShape(kind,O.form)+'</g></svg>';
  A(mk,[{opacity:0,transform:'scale(.95)'},{opacity:1,transform:'scale(1.1)',offset:.6},{opacity:1,transform:'scale(1)'}],{delay:600,duration:250,easing:'ease-out'});

  /* HUD */
  const hudW=wide?720:620;
  const hud=el('div','hud abs',frame,'<b>Turn 0</b><span class="mono">Objectives: 0 / 1</span><span class="st">Exploring</span>');
  hud.style.cssText+=';left:16px;top:16px;width:'+hudW+'px';
  const bd=el('div','badge abs',frame,'<i class="bar"></i><i class="dia"></i><span>Scout Carefully</span>');
  bd.style.left=(W-16-204)+'px';bd.style.top='26px';

  if(O.row){
    const qr=el('div','qrow abs '+(O.why==='parch'?'parch':'dark'),frame,headSVG(kind,O.form,20)+'<span>'+WJ+'</span>');
    qr.style.left='16px';qr.style.top='82px';
  }

  const sn=el('div','snippet abs',frame,SNIPPET);
  sn.style.left=((W-480)/2-40)+'px';sn.style.width='560px';sn.style.top='140px';
  A(sn,[{opacity:0},{opacity:1,offset:.4/3},{opacity:1,offset:2.5/3},{opacity:0}],{delay:900,duration:3000,easing:'linear'});

  /* step row */
  const rowY=H-216;
  const sr=el('div','stepsrow abs',frame,'<span>Steps</span><span class="ds"></span>');
  sr.style.left='0';sr.style.width=W+'px';sr.style.top=rowY+'px';
  const ds=sr.querySelector('.ds');
  for(let i=0;i<R.base;i++){
    const d=el('div','dia28',ds);
    const f=el('div','abs',d,D_FILLED);f.style.cssText='left:0;top:0;width:28px;height:18px';
    if(i<spentN){
      const sp=el('div','abs',d,D_SPENT);sp.style.cssText='left:0;top:0;opacity:0';
      A(sp,[{opacity:0},{opacity:1}],{delay:(i+1)*seg,duration:120});
    }else if(i>=R.base-lostN){
      const lo=el('div','abs',d,O.lost==='slash'?D_SLASH:D_HOLLOW);lo.style.cssText='left:0;top:0;opacity:0';
      A(lo,[{opacity:0},{opacity:1}],{delay:600,duration:200});
      if(O.lost==='hollow')A(f,[{opacity:1},{opacity:0}],{delay:600,duration:200});
    }
  }

  /* action bar */
  const ay=rowY+44;
  const adv=el('button','advance abs',frame,'Advance');
  adv.style.cssText+=';left:16px;top:'+ay+'px;width:'+(W-16-140-12-16)+'px';
  const hm=el('button','home abs',frame,'Return Home');
  hm.style.left=(W-16-140)+'px';hm.style.top=ay+'px';
  adv.onclick=()=>{if(!adv.disabled)play();};
  A(adv,[{opacity:1},{opacity:.65,offset:.02},{opacity:.65,offset:.95},{opacity:1}],{duration:1400,easing:'linear'});

  /* echo bar: one pill, three Echoes */
  const pw=el('div','abs',frame);pw.style.cssText='left:0;width:'+W+'px;top:'+(H-104)+'px;display:flex;justify-content:center;pointer-events:none';
  const pill=el('div','pill',pw);
  ECHOES.forEach((e,i)=>{
    const en=el('div','echo',pill,'<div class="sq">'+e[1]+'</div><div><div class="nm">'+e[0]+'</div><div class="sts '+(R.shaken?'shk':'')+'">'+(R.shaken?'Shaken':'Whole')+'</div></div>');
    if(i===R.named){
      const pulse=el('div','pulse',en);
      A(pulse,[{opacity:.9,transform:'scale(1)'},{opacity:0,transform:'scale(1.1)'}],{delay:900,duration:500,easing:'ease-out'});
      if(O.ring){
        const rest=el('div','rest',en);
        A(rest,[{opacity:0},{opacity:1}],{delay:1300,duration:300});
      }
    }
  });

  /* hit area: union of token and head, at least 48, kept inside the safe area */
  const hxA=sx+hx,hyA=sy+hy;
  let x0=Math.min(sx-25,hxA-28),x1=Math.max(sx+25,hxA+28),y0=Math.min(sy-37,hyA-28),y1=Math.max(sy+13,hyA+28);
  const safe={x0:16,y0:84,x1:W-16,y1:G.safeB};
  const raw=[x0,y0,x1,y1].map(Math.round);
  x0=Math.max(x0,safe.x0);y0=Math.max(y0,safe.y0);x1=Math.min(x1,safe.x1);y1=Math.min(y1,safe.y1);
  const clamped=raw[0]!==Math.round(x0)||raw[1]!==Math.round(y0)||raw[2]!==Math.round(x1)||raw[3]!==Math.round(y1);
  const hit=el('button','hit',frame);hit.setAttribute('aria-label',WJ);hit.setAttribute('aria-expanded','false');
  hit.style.cssText+=';left:'+x0+'px;top:'+y0+'px;width:'+(x1-x0)+'px;height:'+(y1-y0)+'px;pointer-events:none';
  const hitMk=mk;

  /* why card */
  const why=el('div','why '+O.why,frame);
  const cause=R.cause==='directive'
    ?'<span class="dpill"><i class="bar"></i><span>Directive</span></span>'
    :R.cause==='echo'?'<span class="chip">'+ECHOES[R.named][1]+'</span><span>'+WJ+'</span>':'<span>'+WJ+'</span>';
  why.innerHTML=
    '<div class="r"><span class="g"><i class="dot"></i></span><span>'+WJ+'</span></div>'+
    '<div class="r"><span class="g"><i class="dot"></i></span><span>'+WJ+'</span></div>'+
    '<div class="r"><span class="g">'+headSVG(kind,O.form,26)+'</span><span>'+WJ+'</span></div>'+
    '<div class="r"><span class="g"></span>'+cause+'</div>';
  why.style.display='block';const wh=why.offsetHeight;why.style.display='none';
  const rightX=Math.max(hxA+28,sx+25)+16,leftX=Math.min(hxA-28,sx-25)-16-360;
  let wx=side>0?rightX:leftX;
  if(wx<16||wx+360>W-16)wx=side>0?leftX:rightX;
  wx=Math.max(16,Math.min(W-16-360,wx));
  const wy=Math.max(84,Math.min(G.safeB-wh,hyA-30));
  why.style.left=wx+'px';why.style.top=wy+'px';

  function openWhy(open){
    if(cardAnim)cardAnim.cancel();
    if(open){
      why.style.display='block';hit.setAttribute('aria-expanded','true');
      cardAnim=why.animate(RM?[{opacity:0},{opacity:1}]:[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:RM?1:150,easing:'ease-out',fill:'forwards'});
    }else{
      hit.setAttribute('aria-expanded','false');
      cardAnim=why.animate(RM?[{opacity:1},{opacity:0}]:[{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(4px)'}],{duration:RM?1:120,easing:'ease-in',fill:'forwards'});
      const a=cardAnim;a.onfinish=()=>{if(cardAnim===a)why.style.display='none';};
    }
    cardAnim.playbackRate=rate;if(paused)cardAnim.pause();
  }
  const isOpen=()=>why.style.display==='block'&&hit.getAttribute('aria-expanded')==='true';
  hit.onpointerdown=()=>{if(!RM)hitMk.animate([{transform:'scale(1)'},{transform:'scale(.95)'},{transform:'scale(1)'}],{duration:160,easing:'ease-out'});};
  hit.onclick=e=>{e.stopPropagation();openWhy(!isOpen());};
  frame.onpointerdown=e=>{if(isOpen()&&!why.contains(e.target)&&!hit.contains(e.target))openWhy(false);};
  document.onkeydown=e=>{if(e.key==='Escape'&&isOpen())openWhy(false);};

  /* master clock: gates the hit area (marker settled) and the Advance button (calm) */
  const master=frame.animate([{opacity:1},{opacity:1}],{duration:3900,fill:'both'});
  master.pause();master.currentTime=0;master.playbackRate=rate;anims.push(master);tEnd=Math.max(tEnd,3900);
  let tDone=false;
  const timer=setInterval(()=>{
    if(!document.body.contains(frame)||master.playState==='idle')return;
    const t=master.currentTime||0;
    hit.style.pointerEvents=(t>=settleAt||tDone)?'auto':'none';
    adv.disabled=!(t>=1400||tDone);
  },50);
  if(window._tm)clearInterval(window._tm);window._tm=timer;

  document.getElementById('cap').textContent=(R.cap||'')+(st.run==='edge'
    ?'Edge stop. The marker sits low on the board. The drawn mark stays on the cell. The tap area is '+(clamped?'cut back to':'already inside')+' the safe area (x '+Math.round(x0)+' to '+Math.round(x1)+', y '+Math.round(y0)+' to '+Math.round(y1)+').':'');

  frame._ctl={openWhy:openWhy,setDone:()=>{tDone=true;}};
}

function play(){
  anims.forEach(a=>{a.currentTime=0;a.playbackRate=rate;if(!paused)a.play();else a.pause();});
  document.querySelectorAll('.advance').forEach(b=>b.disabled=true);
  document.querySelectorAll('.hit').forEach(b=>b.style.pointerEvents='none');
  const w=document.querySelector('.why');if(w){w.style.display='none';}
}
function freeze(t){
  anims.forEach(a=>{a.pause();a.currentTime=t;});
  if(frame._ctl)frame._ctl.setDone();
}
function run(){
  build();
  const T=P.get('t');
  if(T!==null){freeze(T==='end'?tEnd:Number(T));if(st.why)openWhyNow();}
  else if(SHOT){freeze(tEnd);if(st.why)openWhyNow();}
  else play();
}
function openWhyNow(){const w=document.querySelector('.why');const h=document.querySelector('.hit');w.style.display='block';w.style.opacity=1;h.setAttribute('aria-expanded','true');}

/* ---------- strip ---------- */
function seg(id,items,cur,cb){
  const g=document.getElementById(id);g.innerHTML='';
  items.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;if(k===cur)b.className='on';b.onclick=()=>{cb(k);};g.appendChild(b);});
}
function sync(){
  seg('gOpt',Object.keys(OPTS).map(k=>[k,k+' '+OPTS[k].name]),st.opt,k=>{st.opt=k;sync();run();});
  seg('gRun',Object.keys(RUNS).map(k=>[k,RUNS[k].label]),st.run,k=>{st.run=k;st.kind='';document.getElementById('selKind').value=RUNS[k].kind;sync();run();});
  seg('gSize',[['720','1280x720'],['1080','1920x1080']],String(st.size),k=>{st.size=Number(k);sync();run();});
  const sel=document.getElementById('selKind');
  if(!sel.options.length)Object.keys(KINDS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=KINDS[k];sel.appendChild(o);});
  sel.value=st.kind||RUNS[st.run].kind;
}
document.getElementById('selKind').onchange=e=>{st.kind=e.target.value;run();};
document.getElementById('bReplay').onclick=()=>{paused=false;document.getElementById('bPause').textContent='Pause';run();};
document.getElementById('bPause').onclick=function(){
  paused=!paused;this.textContent=paused?'Play':'Pause';
  anims.forEach(a=>{if(paused)a.pause();else if(a.currentTime<a.effect.getComputedTiming().endTime)a.play();});
  if(cardAnim)paused?cardAnim.pause():cardAnim.play();
};
document.getElementById('bSlow').onclick=function(){
  rate=rate===1?.25:1;this.classList.toggle('on',rate!==1);this.setAttribute('aria-pressed',String(rate!==1));setRate();
};
if(RM)document.getElementById('bSlow').title='Reduced motion is on: movement is replaced by steps.';

/* ---------- comparison table ---------- */
(function(){
  const rows=[
   ['(a) Why card style',      o=>o.why==='parch'?'Parchment, like the top HUD':'Dark modal, like the badge and contact panel'],
   ['(b) Echo named',          o=>o.ring?'Faint ring stays on the card until the next move':'One pulse only, then nothing stays'],
   ['(c) Journey entry',       o=>o.row?'Card, plus one quiet row under the top HUD':'Only inside the card'],
   ['(d) Marker form',         o=>o.form==='per'?'One head shape per stop kind':'One round head with a small kind mark'],
   ['(e) Crossed-out steps',   o=>o.lost==='slash'?'Slash across the spent diamond':'Hollow diamond with a tick']
  ];
  let h='<tr><th>Choice</th>'+Object.keys(OPTS).map(k=>'<th>'+k+' '+OPTS[k].name+'</th>').join('')+'</tr>';
  rows.forEach(r=>{h+='<tr><td>'+r[0]+'</td>'+Object.keys(OPTS).map(k=>'<td>'+r[1](OPTS[k])+'</td>').join('')+'</tr>';});
  document.getElementById('cmp').innerHTML=h;
})();

sync();
run();
})();
</script>
</body>
</html>
